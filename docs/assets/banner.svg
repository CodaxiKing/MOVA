<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="MOVA — Character Motion Control">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1f"/>
      <stop offset="0.55" stop-color="#1c1742"/>
      <stop offset="1" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#c77dff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <ellipse cx="600" cy="170" rx="460" ry="170" fill="url(#glow)"/>

  <!-- left figure: motion source (skeleton) -->
  <g stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55">
    <circle cx="150" cy="118" r="18"/>
    <line x1="150" y1="136" x2="150" y2="220"/>
    <line x1="150" y1="160" x2="104" y2="128"/>
    <line x1="104" y1="128" x2="86" y2="88"/>
    <line x1="150" y1="160" x2="198" y2="186"/>
    <line x1="198" y1="186" x2="226" y2="160"/>
    <line x1="150" y1="220" x2="118" y2="276"/>
    <line x1="118" y1="276" x2="112" y2="320"/>
    <line x1="150" y1="220" x2="186" y2="270"/>
    <line x1="186" y1="270" x2="214" y2="306"/>
  </g>
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="150" cy="160" r="5"/><circle cx="104" cy="128" r="5"/><circle cx="86" cy="88" r="5"/>
    <circle cx="198" cy="186" r="5"/><circle cx="226" cy="160" r="5"/><circle cx="150" cy="220" r="5"/>
    <circle cx="118" cy="276" r="5"/><circle cx="112" cy="320" r="5"/><circle cx="186" cy="270" r="5"/>
    <circle cx="214" cy="306" r="5"/>
  </g>

  <!-- right figure: animated character (same pose, solid) -->
  <g stroke="#c77dff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.5">
    <line x1="1050" y1="138" x2="1050" y2="220"/>
    <line x1="1050" y1="160" x2="1004" y2="128"/>
    <line x1="1004" y1="128" x2="986" y2="88"/>
    <line x1="1050" y1="160" x2="1098" y2="186"/>
    <line x1="1098" y1="186" x2="1126" y2="160"/>
    <line x1="1050" y1="220" x2="1018" y2="276"/>
    <line x1="1018" y1="276" x2="1012" y2="320"/>
    <line x1="1050" y1="220" x2="1086" y2="270"/>
    <line x1="1086" y1="270" x2="1114" y2="306"/>
  </g>
  <circle cx="1050" cy="116" r="22" fill="#c77dff" opacity="0.5"/>

  <!-- motion trail arrows -->
  <g stroke="#ffffff" stroke-width="2" stroke-dasharray="6 10" opacity="0.18">
    <line x1="250" y1="200" x2="330" y2="200"/>
    <line x1="870" y1="200" x2="950" y2="200"/>
  </g>

  <text x="600" y="200" text-anchor="middle" fill="url(#title)"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="168" font-weight="800" letter-spacing="22">MOVA</text>

  <text x="600" y="262" text-anchor="middle" fill="#e9e6ff"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="9">CHARACTER MOTION CONTROL</text>

  <text x="600" y="312" text-anchor="middle" fill="#a9a3d9"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" letter-spacing="2">reference image  +  motion video   →   your character in motion</text>
</svg>
