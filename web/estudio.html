<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<title>Estúdio · MOVA</title>
<!-- Gerado por scripts/build_web.py a partir de design/canvas/project/Main.dc.html. Não editar à mão. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a0b;font-family:'Geist',system-ui,sans-serif;color:#f4f4f5}
a{color:#d2ff3c}a:hover{color:#e6ff8a}
button,input{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,label:focus-within{outline:2px solid #d2ff3c;outline-offset:2px}
</style>
<style>html,body{background:#0a0a0b}#dc-root>div{margin:0 auto}input[type=range]{cursor:pointer}</style>
<script src="dc-runtime.js" defer></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 1440px; height: 1000px; box-sizing: border-box; background: #0a0a0b; color: #f4f4f5; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid #1c1c1f">
<a href="index.html" aria-label="MOVA início" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #f4f4f5">
<span style="width: 32px; height: 32px; border-radius: 9px; background: #d2ff3c; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="2"></circle><path d="M12 7.5l-2 6 4 3v5"></path><path d="M10 13.5l-4 7"></path><path d="M11.5 9l5 2.5 2-3"></path><path d="M11.5 9l-4.5 1-1.5 3"></path></svg>
</span>
<span style="font-family: 'Archivo', sans-serif; font-stretch: 68%; font-weight: 800; font-size: 24px; letter-spacing: 0.02em">MOVA</span>
</a>
<nav aria-label="Principal" style="display: flex; gap: 4px; flex-grow: 1">
<a href="index.html" style="padding: 9px 16px; border-radius: 999px; color: #a1a1aa; text-decoration: none; font-size: 14px">Início</a>
<a href="estudio.html" aria-current="page" style="padding: 9px 16px; border-radius: 999px; background: #1c1c1f; color: #f4f4f5; text-decoration: none; font-size: 14px; font-weight: 500">Estúdio</a>
<a href="movimento.html" style="padding: 9px 16px; border-radius: 999px; color: #a1a1aa; text-decoration: none; font-size: 14px">Movimento</a>
<a href="resultados.html" style="padding: 9px 16px; border-radius: 999px; color: #a1a1aa; text-decoration: none; font-size: 14px">Resultados</a>
<a href="experimentos.html" style="padding: 9px 16px; border-radius: 999px; color: #a1a1aa; text-decoration: none; font-size: 14px">Experimentos</a>
<a href="ambiente.html" style="padding: 9px 16px; border-radius: 999px; color: #a1a1aa; text-decoration: none; font-size: 14px">Ambiente</a>
</nav>
<span style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #141416; border: 1px solid #26262a; font-size: 12px; color: #a1a1aa"><span style="width: 7px; height: 7px; border-radius: 50%; background: #ff4fa3"></span>Simulação · nenhum modelo roda no canvas</span>
</header>

<div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: 404px minmax(0, 1fr)">

<aside aria-labelledby="gen-h" style="border-right: 1px solid #1c1c1f; display: flex; flex-direction: column; min-height: 0">
<div style="flex-grow: 1; min-height: 0; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px">
<h1 id="gen-h" style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 68%; font-weight: 800; font-size: 34px; line-height: 1; text-transform: uppercase">Motion Control</h1>

<div role="group" aria-label="Modelo" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{modelOpts}}" as="o" hint-placeholder-count="2">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; border: 1.5px solid {{o.border}}; background: #141416; color: #f4f4f5; cursor: pointer; text-align: left">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: {{o.iconBg}}; display: flex; align-items: center; justify-content: center; font-family: 'Archivo', sans-serif; font-stretch: 68%; font-weight: 800; font-size: 16px; color: {{o.iconFg}}">{{o.mono}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{o.label}}</span><span style="font-size: 12px; color: #a1a1aa">{{o.sub}}</span></span>
<span style="padding: 3px 8px; border-radius: 999px; background: {{o.tagBg}}; color: {{o.tagFg}}; font-size: 10px; font-weight: 700; letter-spacing: 0.04em">{{o.tag}}</span>
</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 500">Personagem</span>
<label style="position: relative; height: 210px; border-radius: 16px; border: 1.5px dashed {{refBorder}}; background: #141416; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer">
<input type="file" accept="image/*" onChange="{{onRef}}" aria-label="Escolher imagem do personagem" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden">
<sc-if value="{{showRefImg}}" hint-placeholder-val="{{ false }}"><img src="{{refUrl}}" alt="Imagem do personagem enviada" style="width: 100%; height: 100%; object-fit: cover"></sc-if>
<sc-if value="{{showRefSample}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 200 300" style="width: 100%; height: 100%; display: block; background: #1c1c1f" role="img" aria-label="Personagem de exemplo">
<sc-for list="{{refFig.limbs}}" as="l" hint-placeholder-count="10"><line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="{{l.c}}" stroke-width="{{l.w}}" stroke-linecap="round"></line></sc-for>
<circle cx="{{refFig.hx}}" cy="{{refFig.hy}}" r="17" fill="#e7b995"></circle>
<path d="{{refFig.hair}}" fill="#1a1310"></path>
</svg>
</sc-if>
<sc-if value="{{noRef}}" hint-placeholder-val="{{ true }}">
<span style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; text-align: center; font-size: 12px; line-height: 1.4; color: #a1a1aa">
<span style="width: 40px; height: 40px; border-radius: 50%; background: #1c1c1f; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d2ff3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
<span style="color: #f4f4f5; font-size: 13px; font-weight: 500">Imagem</span>corpo inteiro, rosto e mãos visíveis
</span>
</sc-if>
</label>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 500">Movimento</span>
<label style="position: relative; height: 210px; border-radius: 16px; border: 1.5px dashed {{motionBorder}}; background: #141416; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer">
<input type="file" accept="video/*" onChange="{{onMotion}}" aria-label="Escolher vídeo de movimento" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden">
<sc-if value="{{showMotionVid}}" hint-placeholder-val="{{ false }}"><video src="{{motionUrl}}" autoplay="" loop="" muted="" playsinline="" style="width: 100%; height: 100%; object-fit: cover"></video></sc-if>
<sc-if value="{{showMotionSample}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 200 300" style="width: 100%; height: 100%; display: block; background: #1c1c1f" role="img" aria-label="Vídeo de dança de exemplo">
<sc-for list="{{dance.lines}}" as="l" hint-placeholder-count="12"><line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="#d2ff3c" stroke-width="4" stroke-linecap="round"></line></sc-for>
</svg>
</sc-if>
<sc-if value="{{noMotion}}" hint-placeholder-val="{{ true }}">
<span style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; text-align: center; font-size: 12px; line-height: 1.4; color: #a1a1aa">
<span style="width: 40px; height: 40px; border-radius: 50%; background: #1c1c1f; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d2ff3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10.5l5-3v9l-5-3"></path></svg></span>
<span style="color: #f4f4f5; font-size: 13px; font-weight: 500">Vídeo .mp4</span>uma pessoa, câmera estável
</span>
</sc-if>
</label>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 500">Identidade extra</span><span style="color: #8b8b93">opcional</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{extras}}" as="x" hint-placeholder-count="3">
<label style="position: relative; height: 72px; border-radius: 12px; border: 1.5px dashed #3a3a40; background: #141416; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; color: #a1a1aa; font-size: 18px">
<input type="file" accept="image/*" onChange="{{x.onPick}}" aria-label="{{x.aria}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden">
<sc-if value="{{x.has}}" hint-placeholder-val="{{ false }}"><img src="{{x.url}}" alt="{{x.aria}}" style="width: 100%; height: 100%; object-fit: cover"></sc-if>
<sc-if value="{{x.empty}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true">+</span></sc-if>
</label>
</sc-for>
<button type="button" onClick="{{useSamples}}" style="height: 72px; border-radius: 12px; border: none; background: #1c1c1f; color: #f4f4f5; font-size: 11px; font-weight: 500; line-height: 1.3; cursor: pointer">Usar<br>exemplos</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="padding: 7px 12px; border-radius: 999px; background: #141416; border: 1px solid #26262a; font-family: 'Geist Mono', monospace; font-size: 12px">256p</span>
<span style="padding: 7px 12px; border-radius: 999px; background: #141416; border: 1px solid #26262a; font-family: 'Geist Mono', monospace; font-size: 12px">{{frames}} quadros</span>
<span style="padding: 7px 12px; border-radius: 999px; background: #141416; border: 1px solid #26262a; font-family: 'Geist Mono', monospace; font-size: 12px">16 fps</span>
<span style="padding: 7px 12px; border-radius: 999px; background: #141416; border: 1px solid #26262a; font-family: 'Geist Mono', monospace; font-size: 12px">seed {{seed}}</span>
<span style="padding: 7px 12px; border-radius: 999px; background: #141416; border: 1px solid #26262a; font-family: 'Geist Mono', monospace; font-size: 12px">perfil 8 GB</span>
</div>

<div style="border-radius: 16px; background: #141416; border: 1px solid #26262a">
<button type="button" onClick="{{toggleAdv}}" aria-expanded="{{advExpanded}}" style="width: 100%; min-height: 48px; padding: 0 16px; border: none; background: transparent; color: #f4f4f5; font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; cursor: pointer">Configurações avançadas<span style="color: #a1a1aa; font-size: 18px" aria-hidden="true">{{advIcon}}</span></button>
<sc-if value="{{advOpen}}" hint-placeholder-val="{{ false }}">
<div style="padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="lbl-dev" style="font-size: 12px; color: #a1a1aa">Dispositivo</span>
<div role="group" aria-labelledby="lbl-dev" style="display: flex; gap: 2px; padding: 3px; background: #0a0a0b; border-radius: 999px">
<sc-for list="{{deviceOpts}}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="flex-grow: 1; min-height: 34px; border: none; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Geist Mono', monospace; font-size: 11px; cursor: pointer">{{o.label}}</button></sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="lbl-prec" style="font-size: 12px; color: #a1a1aa">Precisão</span>
<div role="group" aria-labelledby="lbl-prec" style="display: flex; gap: 2px; padding: 3px; background: #0a0a0b; border-radius: 999px">
<sc-for list="{{precOpts}}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="flex-grow: 1; min-height: 34px; border: none; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Geist Mono', monospace; font-size: 11px; cursor: pointer">{{o.label}}</button></sc-for>
</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; align-items: center; background: #0a0a0b; border-radius: 999px">
<button type="button" onClick="{{framesDown}}" aria-label="Menos quadros" style="width: 40px; height: 40px; border: none; background: transparent; color: #f4f4f5; font-size: 17px; cursor: pointer">−</button>
<span style="flex-grow: 1; text-align: center; font-size: 12px; color: #a1a1aa">quadros <span style="font-family: 'Geist Mono', monospace; color: #f4f4f5">{{frames}}</span></span>
<button type="button" onClick="{{framesUp}}" aria-label="Mais quadros" style="width: 40px; height: 40px; border: none; background: transparent; color: #f4f4f5; font-size: 17px; cursor: pointer">+</button>
</div>
<div style="display: flex; align-items: center; background: #0a0a0b; border-radius: 999px">
<button type="button" onClick="{{stepsDown}}" aria-label="Menos passos" style="width: 40px; height: 40px; border: none; background: transparent; color: #f4f4f5; font-size: 17px; cursor: pointer">−</button>
<span style="flex-grow: 1; text-align: center; font-size: 12px; color: #a1a1aa">passos <span style="font-family: 'Geist Mono', monospace; color: #f4f4f5">{{steps}}</span></span>
<button type="button" onClick="{{stepsUp}}" aria-label="Mais passos" style="width: 40px; height: 40px; border: none; background: transparent; color: #f4f4f5; font-size: 17px; cursor: pointer">+</button>
</div>
</div>
<label for="gs" style="display: flex; justify-content: space-between; font-size: 12px; color: #a1a1aa"><span>Guidance</span><span style="font-family: 'Geist Mono', monospace; color: #f4f4f5">{{guidanceLabel}}</span></label>
<input id="gs" type="range" min="1" max="10" step="0.5" value="{{guidance}}" onChange="{{onGuidance}}" style="accent-color: #d2ff3c; margin: -8px 0 0">
<label for="cs" style="display: flex; justify-content: space-between; font-size: 12px; color: #a1a1aa"><span>Força do controle</span><span style="font-family: 'Geist Mono', monospace; color: #f4f4f5">{{condLabel}}</span></label>
<input id="cs" type="range" min="0" max="2" step="0.1" value="{{cond}}" onChange="{{onCond}}" style="accent-color: #d2ff3c; margin: -8px 0 0">
<div style="display: flex; align-items: center; gap: 10px">
<label for="seed" style="font-size: 12px; color: #a1a1aa">Seed</label>
<input id="seed" type="number" value="{{seed}}" onChange="{{onSeed}}" style="flex-grow: 1; min-width: 0; height: 38px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid #26262a; background: #0a0a0b; color: #f4f4f5; font-family: 'Geist Mono', monospace; font-size: 13px">
</div>
</div>
</sc-if>
</div>

<sc-if value="{{hasWarnings}}" hint-placeholder-val="{{ true }}">
<ul style="margin: 0; padding: 12px 14px 12px 30px; border-radius: 14px; background: #2a1320; border: 1px solid #5c2442; font-size: 12px; line-height: 1.5; color: #ffc2de; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{warnings}}" as="w" hint-placeholder-count="2"><li>{{w}}</li></sc-for>
</ul>
</sc-if>
</div>

<div style="padding: 16px 20px 20px; border-top: 1px solid #1c1c1f; display: flex; flex-direction: column; gap: 10px">
<button type="button" onClick="{{generate}}" disabled="{{genDisabled}}" style="min-height: 56px; border-radius: 999px; border: none; background: {{genBg}}; color: {{genFg}}; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">{{genLabel}}
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{genFg}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></button>
<span style="text-align: center; font-size: 12px; color: #8b8b93">{{genHint}}</span>
</div>
</aside>

<main style="min-width: 0; min-height: 0; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="position: relative; height: 560px; flex-shrink: 0; border-radius: 24px; background: #111113; border: 1px solid #1c1c1f; overflow: hidden">

<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
<sc-if value="{{outFigure}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 200 300" style="height: 100%; display: block" role="img" aria-label="Quadro gerado simulado">
<ellipse cx="100" cy="266" rx="46" ry="5" fill="#000000" opacity="0.6"></ellipse>
<sc-for list="{{outFig.limbs}}" as="l" hint-placeholder-count="10"><line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="{{l.c}}" stroke-width="{{l.w}}" stroke-linecap="round"></line></sc-for>
<sc-for list="{{outFig.hands}}" as="h" hint-placeholder-count="2"><circle cx="{{h.x}}" cy="{{h.y}}" r="6" fill="#e7b995"></circle></sc-for>
<circle cx="{{outFig.hx}}" cy="{{outFig.hy}}" r="17" fill="#e7b995"></circle>
<path d="{{outFig.hair}}" fill="#1a1310"></path>
</svg>
</sc-if>
<sc-if value="{{outNoise}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 10 15" preserveAspectRatio="none" style="height: 100%; width: 373px; display: block" role="img" aria-label="Saída de ruído do pipeline tiny">
<sc-for list="{{noise}}" as="n" hint-placeholder-count="150"><rect x="{{n.x}}" y="{{n.y}}" width="1" height="1" fill="{{n.c}}"></rect></sc-for>
</svg>
</sc-if>
<sc-if value="{{outBusy}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<span style="font-family: 'Archivo', sans-serif; font-stretch: 68%; font-weight: 800; font-size: 120px; line-height: 0.9; color: #d2ff3c">{{progressPct}}</span>
<span style="font-size: 15px; color: #f4f4f5">{{busyStage}}</span>
<div style="width: 320px; height: 4px; border-radius: 2px; background: #26262a; overflow: hidden"><div style="height: 4px; width: {{progressPct}}; background: #d2ff3c"></div></div>
</div>
</sc-if>
<sc-if value="{{outIdle}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<span style="font-family: 'Archivo', sans-serif; font-stretch: 68%; font-weight: 800; font-size: 64px; line-height: 0.92; text-transform: uppercase; color: #3a3a40">Seu vídeo<br>aparece aqui</span>
<span style="font-size: 14px; color: #a1a1aa">{{idleHint}}</span>
</div>
</sc-if>
</div>

<div style="position: absolute; left: 16px; top: 16px; display: flex; gap: 6px">
<span style="padding: 7px 12px; border-radius: 999px; background: #0a0a0b; font-size: 12px; font-weight: 500">{{outCaption}}</span>
<span style="padding: 7px 12px; border-radius: 999px; background: #0a0a0b; font-family: 'Geist Mono', monospace; font-size: 12px; color: #a1a1aa">256p · {{frames}}q · 16 fps</span>
</div>

<div style="position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 10px">
<figure style="margin: 0; position: relative; width: 116px; height: 164px; border-radius: 14px; background: #1c1c1f; border: 1px solid #3a3a40; overflow: hidden">
<sc-if value="{{showRefImg}}" hint-placeholder-val="{{ false }}"><img src="{{refUrl}}" alt="" style="width: 100%; height: 100%; object-fit: cover"></sc-if>
<sc-if value="{{showRefSample}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 200 300" style="width: 100%; height: 100%; display: block" aria-hidden="true">
<sc-for list="{{refFig.limbs}}" as="l" hint-placeholder-count="10"><line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="{{l.c}}" stroke-width="{{l.w}}" stroke-linecap="round"></line></sc-for>
<circle cx="{{refFig.hx}}" cy="{{refFig.hy}}" r="17" fill="#e7b995"></circle>
<path d="{{refFig.hair}}" fill="#1a1310"></path>
</svg>
</sc-if>
<figcaption style="position: absolute; left: 6px; bottom: 6px; padding: 3px 8px; border-radius: 999px; background: #0a0a0b; font-size: 10px">referência</figcaption>
</figure>
<figure style="margin: 0; position: relative; width: 116px; height: 164px; border-radius: 14px; background: #000000; border: 1px solid #3a3a40; overflow: hidden">
<sc-if value="{{hasMotion}}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 200 300" style="width: 100%; height: 100%; display: block" role="img" aria-label="Controle de pose estilo OpenPose">
<sc-for list="{{dance.lines}}" as="l" hint-placeholder-count="12"><line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="{{l.c}}" stroke-width="6" stroke-linecap="round"></line></sc-for>
</svg>
</sc-if>
<figcaption style="position: absolute; left: 6px; bottom: 6px; padding: 3px 8px; border-radius: 999px; background: #1c1c1f; font-size: 10px">controle</figcaption>
</figure>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 16px; padding: 8px 16px 8px 8px; border-radius: 999px; background: #0a0a0b; display: flex; align-items: center; gap: 14px">
<button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: none; background: #d2ff3c; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0b" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8 5v14"></path><path d="M16 5v14"></path></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="#0a0a0b" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg></sc-if>
</button>
<label for="scrub" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Quadro</label>
<input id="scrub" type="range" min="0" max="{{lastFrame}}" step="1" value="{{frame}}" onChange="{{onScrub}}" style="flex-grow: 1; accent-color: #d2ff3c">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #a1a1aa">{{frameNum}} / {{frames}}</span>
</div>
</div>

<ol aria-label="Pipeline" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="5">
<li style="padding: 12px 14px; border-radius: 16px; background: #141416; border: 1px solid {{s.border}}; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{s.dot}}"></span>{{s.label}}</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #8b8b93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.detail}}</span>
<span style="font-size: 11px; color: {{s.stColor}}">{{s.status}}</span>
</li>
</sc-for>
</ol>

<div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px">
<section aria-labelledby="hist-h" style="min-width: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 id="hist-h" style="margin: 0; font-size: 15px; font-weight: 600">Suas gerações</h2><span style="font-size: 12px; color: #8b8b93">nesta sessão</span></div>
<div style="display: flex; gap: 10px; flex-grow: 1; min-height: 0">
<sc-for list="{{history}}" as="h" hint-placeholder-count="2">
<div style="width: 104px; flex-shrink: 0; border-radius: 14px; background: #141416; border: 1px solid #26262a; overflow: hidden; display: flex; flex-direction: column">
<div style="flex-grow: 1; min-height: 0; background: {{h.bg}}; display: flex; align-items: center; justify-content: center; font-family: 'Archivo', sans-serif; font-stretch: 68%; font-weight: 800; font-size: 22px; color: {{h.fg}}">{{h.mono}}</div>
<span style="padding: 6px 8px; font-family: 'Geist Mono', monospace; font-size: 10px; color: #a1a1aa">{{h.meta}}</span>
</div>
</sc-for>
<sc-if value="{{noHistory}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; border-radius: 14px; border: 1.5px dashed #26262a; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #8b8b93">Nenhuma geração ainda</div>
</sc-if>
</div>
</section>
<section aria-labelledby="cmd-h" style="min-width: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 id="cmd-h" style="margin: 0; font-size: 15px; font-weight: 600">Comando CLI</h2><button type="button" onClick="{{copyCmd}}" style="min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #3a3a40; background: transparent; color: #f4f4f5; font-size: 12px; cursor: pointer">{{copyLabel}}</button></div>
<pre style="margin: 0; flex-grow: 1; min-height: 0; overflow: auto; padding: 10px 14px; border-radius: 14px; background: #141416; border: 1px solid #26262a; font-family: 'Geist Mono', monospace; font-size: 11px; line-height: 1.55; color: #d4d4d8; white-space: pre-wrap">{{command}}</pre>
</section>
</div>
</main>
</div>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
function buildJoints(p) {
  var b = p.bob, J = {};
  J.head = { x: 100, y: 62 + b }; J.neck = { x: 100, y: 96 + b }; J.hip = { x: 100, y: 170 + b };
  J.lSh = { x: 78, y: 100 + b }; J.rSh = { x: 122, y: 100 + b };
  J.lHip = { x: 89, y: 170 + b }; J.rHip = { x: 111, y: 170 + b };
  function P(o, len, a, s) { return { x: o.x + s * len * Math.sin(a), y: o.y + len * Math.cos(a) }; }
  J.lEl = P(J.lSh, 34, p.la1, -1); J.lWr = P(J.lEl, 30, p.la2, -1);
  J.rEl = P(J.rSh, 34, p.ra1, 1); J.rWr = P(J.rEl, 30, p.ra2, 1);
  J.lKn = P(J.lHip, 46, p.ll1, -1); J.lAn = P(J.lKn, 46, p.ll2, -1);
  J.rKn = P(J.rHip, 46, p.rl1, 1); J.rAn = P(J.rKn, 46, p.rl2, 1);
  return J;
}
function danceParams(f, n) {
  var t = f / n * 2 * Math.PI, s = 0.5 + 0.5 * Math.sin(t), s2 = 0.5 - 0.5 * Math.sin(t), c = Math.cos(t);
  var up = Math.max(0, Math.sin(t)), dn = Math.max(0, -Math.sin(t));
  return { la1: 0.5 + 1.6 * s, la2: 0.9 + 1.6 * s + 0.6 * c, ra1: 0.5 + 1.6 * s2, ra2: 0.9 + 1.6 * s2 - 0.6 * c,
    ll1: 0.1 + 0.45 * up, ll2: 0.1 - 0.15 * up, rl1: 0.1 + 0.45 * dn, rl2: 0.1 - 0.15 * dn, bob: 3 * Math.sin(2 * t) };
}
var NEUTRAL = { la1: 0.3, la2: 0.2, ra1: 0.3, ra2: 0.2, ll1: 0.08, ll2: 0.04, rl1: 0.08, rl2: 0.04, bob: 0 };
var SEGS = [
  ['head', 'neck', '#ff0055'], ['neck', 'hip', '#ff5500'], ['lSh', 'rSh', '#ff5500'], ['lHip', 'rHip', '#ff7a00'],
  ['lSh', 'lEl', '#00ff55'], ['lEl', 'lWr', '#00ffaa'], ['rSh', 'rEl', '#ffaa00'], ['rEl', 'rWr', '#ffff00'],
  ['lHip', 'lKn', '#aa00ff'], ['lKn', 'lAn', '#ff00ff'], ['rHip', 'rKn', '#00aaff'], ['rKn', 'rAn', '#0055ff']
];
var BODY = [
  ['lHip', 'lKn', '#3a3f5c', 16], ['lKn', 'lAn', '#3a3f5c', 14], ['rHip', 'rKn', '#3a3f5c', 16], ['rKn', 'rAn', '#3a3f5c', 14],
  ['neck', 'hip', '#ff4fa3', 34], ['lSh', 'rSh', '#ff4fa3', 16],
  ['lSh', 'lEl', '#ff4fa3', 13], ['lEl', 'lWr', '#ff4fa3', 11], ['rSh', 'rEl', '#ff4fa3', 13], ['rEl', 'rWr', '#ff4fa3', 11]
];
function r1(v) { return Math.round(v * 10) / 10; }
function skeleton(J) { return { lines: SEGS.map(function (s) { return { x1: r1(J[s[0]].x), y1: r1(J[s[0]].y), x2: r1(J[s[1]].x), y2: r1(J[s[1]].y), c: s[2] }; }) }; }
function figure(J) {
  return {
    limbs: BODY.map(function (s) { return { x1: r1(J[s[0]].x), y1: r1(J[s[0]].y), x2: r1(J[s[1]].x), y2: r1(J[s[1]].y), c: s[2], w: s[3] }; }),
    hands: [{ x: r1(J.lWr.x), y: r1(J.lWr.y) }, { x: r1(J.rWr.x), y: r1(J.rWr.y) }],
    hx: r1(J.head.x), hy: r1(J.head.y - 4),
    hair: 'M' + r1(J.head.x - 18) + ' ' + r1(J.head.y - 2) + ' A18 18 0 0 1 ' + r1(J.head.x + 18) + ' ' + r1(J.head.y - 2) + ' L' + r1(J.head.x + 20) + ' ' + r1(J.head.y + 14) + ' L' + r1(J.head.x + 13) + ' ' + r1(J.head.y - 6) + ' L' + r1(J.head.x - 13) + ' ' + r1(J.head.y - 6) + ' L' + r1(J.head.x - 20) + ' ' + r1(J.head.y + 14) + ' Z'
  };
}
var STAGES = [
  { key: 'extract', label: 'Extração', detail: 'MediaPipe corpo/rosto/mãos', until: 20 },
  { key: 'render', label: 'Controle', detail: 'pose_openpose.mp4', until: 34 },
  { key: 'sample', label: 'Amostragem', detail: 'WanVACEPipeline', until: 90 },
  { key: 'validate', label: 'Validação', detail: 'evaluation/video.py', until: 98 },
  { key: 'record', label: 'Registro', detail: 'run.json', until: 100 }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { refUrl: null, refName: null, refSample: false, extras: [null, null, null],
      motionUrl: null, motionName: null, motionSample: false, frame: 0, playing: false, adv: false, copied: false,
      model: 'tiny', device: 'auto', precision: 'auto', frames: 17, steps: 30, guidance: 5, cond: 1, seed: 42,
      phase: 'idle', progress: 0, history: [] };
  }
  componentWillUnmount() { clearInterval(this.playT); clearInterval(this.genT); }
  opts(key, list) {
    var self = this, cur = this.state[key];
    return list.map(function (o) {
      var on = cur === o.v;
      return { label: o.label, bg: on ? '#d2ff3c' : 'transparent', fg: on ? '#0a0a0b' : '#f4f4f5',
        pressed: on ? 'true' : 'false', pick: function () { var u = {}; u[key] = o.v; u.phase = 'idle'; u.progress = 0; self.setState(u); } };
    });
  }
  renderVals() {
    var s = this.state, self = this;
    var hasRef = !!(s.refUrl || s.refSample), hasMotion = !!(s.motionUrl || s.motionSample);
    var n = s.frames, frame = Math.min(s.frame, n - 1);
    var J = buildJoints(danceParams(frame, n));
    var busy = s.phase === 'running', done = s.phase === 'done';
    var p = s.progress, busyStage = '';

    var stages = STAGES.map(function (st, i) {
      var start = i === 0 ? 0 : STAGES[i - 1].until;
      var state = done || p >= st.until ? 'ok' : (busy && p >= start ? 'run' : 'wait');
      var detail = st.detail;
      if (st.key === 'sample' && state === 'run') detail = 'passo ' + Math.max(1, Math.round((p - 34) / 56 * s.steps)) + '/' + s.steps;
      if (state === 'run') busyStage = st.label + ' · ' + detail;
      return { label: st.label, detail: detail,
        status: state === 'ok' ? 'concluído (simulado)' : state === 'run' ? 'em andamento' : 'aguardando',
        dot: state === 'ok' ? '#d2ff3c' : state === 'run' ? '#ff4fa3' : '#3a3a40',
        stColor: state === 'ok' ? '#d2ff3c' : state === 'run' ? '#ff8cc4' : '#8b8b93',
        border: state === 'run' ? '#ff4fa3' : '#26262a' };
    });

    var warnings = [];
    if (s.model === 'wan') warnings.push('Pesos Wan2.1-VACE-1.3B (~19 GB) ainda não estão no cache: exige --allow-download e sua autorização.');
    if (s.model === 'wan' && s.device === 'cpu') warnings.push('Wan em CPU é impraticável: exige --allow-cpu.');
    if (s.model === 'wan' && s.frames > 17) warnings.push('Acima do perfil 8 GB (17 quadros): risco real de falta de VRAM.');
    if (s.precision === 'bf16' && s.device === 'cpu') warnings.push('bf16 em CPU é lento; prefira fp32.');

    var ref = s.refName ? 'assets/reference/' + s.refName : 'assets/reference/maya.png';
    var mot = s.motionName ? 'assets/motion/' + s.motionName : 'assets/motion/dance.mp4';
    var cmd = 'mova infer --model ' + s.model + ' --device ' + s.device + ' --precision ' + s.precision + ' \\\n  --reference ' + ref + ' \\\n  --motion ' + mot + ' \\\n  --output outputs/studio/output.mp4 \\\n  --set generation.num_frames=' + s.frames + ' \\\n  --set generation.num_inference_steps=' + s.steps + ' \\\n  --set generation.guidance_scale=' + s.guidance.toFixed(1) + ' \\\n  --set generation.conditioning_scale=' + s.cond.toFixed(1) + ' \\\n  --set generation.seed=' + s.seed;
    if (s.model === 'wan') cmd += ' \\\n  --allow-download';
    if (s.model === 'wan' && s.device === 'cpu') cmd += ' --allow-cpu';

    var noise = [];
    if (done && s.model === 'tiny') {
      for (var y = 0; y < 15; y++) for (var x = 0; x < 10; x++) {
        var v = Math.abs(Math.sin((x * 12.9898 + y * 78.233 + frame * 37.719) * 43.7)) % 1;
        var g = Math.round(30 + v * 190);
        noise.push({ x: x, y: y, c: 'rgb(' + g + ',' + g + ',' + Math.min(255, Math.round(g * 1.05)) + ')' });
      }
    }

    var models = [
      { v: 'tiny', label: 'tiny · smoke test', sub: 'pipeline aleatório, sem pesos', mono: 'T', tag: 'CPU', tagBg: '#1c1c1f', tagFg: '#f4f4f5' },
      { v: 'wan', label: 'Wan2.1-VACE 1.3B', sub: 'baseline Fase 1 · Diffusers', mono: 'W', tag: 'GPU 8 GB', tagBg: '#ff4fa3', tagFg: '#0a0a0b' }
    ];

    return {
      refUrl: s.refUrl, motionUrl: s.motionUrl,
      showRefImg: !!s.refUrl, showRefSample: !s.refUrl && s.refSample, noRef: !hasRef,
      showMotionVid: !!s.motionUrl, showMotionSample: !s.motionUrl && s.motionSample, noMotion: !hasMotion, hasMotion: hasMotion,
      refBorder: hasRef ? '#d2ff3c' : '#3a3a40', motionBorder: hasMotion ? '#d2ff3c' : '#3a3a40',
      refFig: figure(buildJoints(NEUTRAL)), outFig: figure(J), dance: skeleton(J), noise: noise,
      extras: s.extras.map(function (u, i) {
        return { url: u, has: !!u, empty: !u, aria: 'Imagem extra de identidade ' + (i + 1),
          onPick: function (e) { var f = e.target.files && e.target.files[0]; if (!f) return; var ex = self.state.extras.slice(); ex[i] = URL.createObjectURL(f); self.setState({ extras: ex }); } };
      }),
      onRef: function (e) { var f = e.target.files && e.target.files[0]; if (f) self.setState({ refUrl: URL.createObjectURL(f), refName: f.name, phase: 'idle', progress: 0 }); },
      onMotion: function (e) { var f = e.target.files && e.target.files[0]; if (f) self.setState({ motionUrl: URL.createObjectURL(f), motionName: f.name, phase: 'idle', progress: 0 }); },
      useSamples: function () { self.setState({ refSample: true, motionSample: true, phase: 'idle', progress: 0 }); },
      modelOpts: models.map(function (m) {
        var on = s.model === m.v;
        return { label: m.label, sub: m.sub, mono: m.mono, tag: m.tag, tagBg: m.tagBg, tagFg: m.tagFg,
          border: on ? '#d2ff3c' : '#26262a', iconBg: on ? '#d2ff3c' : '#1c1c1f', iconFg: on ? '#0a0a0b' : '#f4f4f5',
          pressed: on ? 'true' : 'false', pick: function () { self.setState({ model: m.v, phase: 'idle', progress: 0 }); } };
      }),
      deviceOpts: this.opts('device', [{ v: 'auto', label: 'auto' }, { v: 'cpu', label: 'cpu' }, { v: 'cuda:0', label: 'cuda:0' }]),
      precOpts: this.opts('precision', [{ v: 'auto', label: 'auto' }, { v: 'fp32', label: 'fp32' }, { v: 'bf16', label: 'bf16' }]),
      advOpen: s.adv, advExpanded: s.adv ? 'true' : 'false', advIcon: s.adv ? '−' : '+',
      toggleAdv: function () { self.setState({ adv: !self.state.adv }); },
      frame: frame, frameNum: frame + 1, frames: s.frames, lastFrame: n - 1,
      playing: s.playing, paused: !s.playing, playLabel: s.playing ? 'Pausar' : 'Reproduzir',
      togglePlay: function () {
        if (self.state.playing) { clearInterval(self.playT); self.setState({ playing: false }); return; }
        self.playT = setInterval(function () { self.setState({ frame: (Math.min(self.state.frame, self.state.frames - 1) + 1) % self.state.frames }); }, 1000 / 12);
        self.setState({ playing: true });
      },
      onScrub: function (e) { self.setState({ frame: parseInt(e.target.value, 10) || 0 }); },
      outFigure: done && s.model === 'wan', outNoise: done && s.model === 'tiny', outBusy: busy, outIdle: !busy && !done,
      busyStage: busyStage, progressPct: p + '%',
      idleHint: hasRef && hasMotion ? 'Tudo pronto. Clique em Gerar.' : 'Adicione um personagem e um vídeo de movimento à esquerda.',
      outCaption: done ? (s.model === 'wan' ? 'Saída · prévia simulada' : 'Saída tiny · ruído (valida só o contrato)') : 'Saída · output.mp4',
      stages: stages,
      history: s.history, noHistory: s.history.length === 0,
      framesDown: function () { self.setState({ frames: Math.max(5, self.state.frames - 4), frame: 0 }); },
      framesUp: function () { self.setState({ frames: Math.min(33, self.state.frames + 4), frame: 0 }); },
      steps: s.steps,
      stepsDown: function () { self.setState({ steps: Math.max(5, self.state.steps - 5) }); },
      stepsUp: function () { self.setState({ steps: Math.min(50, self.state.steps + 5) }); },
      guidance: s.guidance, guidanceLabel: s.guidance.toFixed(1),
      onGuidance: function (e) { self.setState({ guidance: parseFloat(e.target.value) }); },
      cond: s.cond, condLabel: s.cond.toFixed(1),
      onCond: function (e) { self.setState({ cond: parseFloat(e.target.value) }); },
      seed: s.seed, onSeed: function (e) { self.setState({ seed: parseInt(e.target.value, 10) || 0 }); },
      warnings: warnings, hasWarnings: warnings.length > 0, command: cmd,
      copyLabel: s.copied ? 'Copiado' : 'Copiar',
      copyCmd: function () {
        try { navigator.clipboard.writeText(cmd.replace(/\\\n\s*/g, '')); } catch (e) {}
        self.setState({ copied: true }); setTimeout(function () { self.setState({ copied: false }); }, 1500);
      },
      genDisabled: !hasRef || !hasMotion || busy,
      genBg: !hasRef || !hasMotion ? '#1c1c1f' : busy ? '#3a3a40' : '#d2ff3c',
      genFg: !hasRef || !hasMotion || busy ? '#8b8b93' : '#0a0a0b',
      genLabel: busy ? 'Gerando… ' + p + '%' : done ? 'Gerar novamente' : 'Gerar',
      genHint: s.model === 'wan' ? 'Wan · ' + s.steps + ' passos · ' + s.frames + ' quadros · simulação' : 'tiny · valida o pipeline sem pesos · simulação',
      generate: function () {
        clearInterval(self.genT);
        self.setState({ phase: 'running', progress: 0 });
        self.genT = setInterval(function () {
          var np = Math.min(100, self.state.progress + 2);
          if (np >= 100) {
            clearInterval(self.genT);
            var m = self.state.model, h = self.state.history.slice(0, 5);
            h.unshift({ mono: m === 'wan' ? 'WAN' : 'TINY', bg: m === 'wan' ? '#ff4fa3' : '#1c1c1f', fg: m === 'wan' ? '#0a0a0b' : '#f4f4f5',
              meta: self.state.frames + 'q · s' + self.state.seed });
            self.setState({ progress: 100, phase: 'done', history: h });
          } else self.setState({ progress: np });
        }, 90);
      }
    };
  }
}
</script>
