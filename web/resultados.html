<title>Resultados · MOVA</title>
<!-- Gerado por scripts/build_web.py a partir de design/canvas/project/Result.dc.html. Não editar à mão. -->

<body>

<template id="dc-template">
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #0a0a0b; color: #f4f4f5; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column">

<a href="estudio.html" style="padding: 9px 16px; border-radius: 999px; color: #a1a1aa; text-decoration: none; font-size: 14px">Estúdio</a>
<a href="movimento.html" style="padding: 9px 16px; border-radius: 999px; color: #a1a1aa; text-decoration: none; font-size: 14px">Movimento</a>

<div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 20px 24px 24px; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px">

<section aria-labelledby="cmp-h" style="background: #141416; border: 1px solid #26262a; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h1 id="cmp-h" style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 68%; font-weight: 800; font-size: 38px; line-height: 1; text-transform: uppercase">Lado a lado</h1>
<span style="font-size: 12px; color: #a1a1aa">save_side_by_side · prévia simulada</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="height: 520px; border-radius: 16px; background: #1c1c1f; overflow: hidden">
<svg viewBox="0 0 200 300" style="width: 100%; height: 100%; display: block" role="img" aria-label="Referência">
<sc-for list="{{ref.limbs}}" as="l" hint-placeholder-count="10"><line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="{{l.c}}" stroke-width="{{l.w}}" stroke-linecap="round"></line></sc-for>
<sc-for list="{{ref.hands}}" as="h" hint-placeholder-count="2"><circle cx="{{h.x}}" cy="{{h.y}}" r="6" fill="#e7b995"></circle></sc-for>
<circle cx="{{ref.hx}}" cy="{{ref.hy}}" r="17" fill="#e7b995"></circle>
<path d="{{ref.hair}}" fill="#1a1310"></path>
</svg>
</div>
<figcaption style="font-size: 13px; color: #a1a1aa">Referência</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="height: 520px; border-radius: 16px; background: #000000; overflow: hidden">
<svg viewBox="0 0 200 300" style="width: 100%; height: 100%; display: block" role="img" aria-label="Controle de pose">
<sc-for list="{{ctrl}}" as="l" hint-placeholder-count="12"><line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="{{l.c}}" stroke-width="5" stroke-linecap="round"></line></sc-for>
</svg>
</div>
<figcaption style="font-size: 13px; color: #a1a1aa">Controle</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="height: 520px; border-radius: 16px; background: #1c1c1f; overflow: hidden; border: 1px solid #d2ff3c">
<svg viewBox="0 0 200 300" style="width: 100%; height: 100%; display: block" role="img" aria-label="Saída">
<sc-for list="{{out.limbs}}" as="l" hint-placeholder-count="10"><line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="{{l.c}}" stroke-width="{{l.w}}" stroke-linecap="round"></line></sc-for>
<sc-for list="{{out.hands}}" as="h" hint-placeholder-count="2"><circle cx="{{h.x}}" cy="{{h.y}}" r="6" fill="#e7b995"></circle></sc-for>
<circle cx="{{out.hx}}" cy="{{out.hy}}" r="17" fill="#e7b995"></circle>
<path d="{{out.hair}}" fill="#1a1310"></path>
</svg>
</div>
<figcaption style="font-size: 13px; color: #a1a1aa">Saída · output.mp4</figcaption>
</figure>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: none; background: #d2ff3c; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a0a0b" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M8 5v14"></path><path d="M16 5v14"></path></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0a0a0b" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg></sc-if>
</button>
<label for="rscrub" style="font-size: 13px; color: #a1a1aa">Quadro</label>
<input id="rscrub" type="range" min="0" max="16" step="1" value="{{frame}}" onChange="{{onScrub}}" style="flex-grow: 1; accent-color: #d2ff3c; height: 44px">
<span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: #a1a1aa">{{frameNum}} / 17 · 16 fps</span>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 16px; min-width: 0">
<section aria-labelledby="int-h" style="background: #141416; border: 1px solid #26262a; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 id="int-h" style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a1a1aa">Integridade do vídeo</h2>
<dl style="margin: 0; display: grid; grid-template-columns: 1fr auto auto; gap: 8px 14px; font-size: 13px; align-items: baseline">
<dt style="color: #a1a1aa">Quadros (4k+1)</dt><dd style="margin: 0; font-family: 'Geist Mono', monospace">esperado 17</dd><dd style="margin: 0; font-family: 'Geist Mono', monospace; color: #8b8b93">[medido]</dd>
<dt style="color: #a1a1aa">FPS</dt><dd style="margin: 0; font-family: 'Geist Mono', monospace">esperado 16</dd><dd style="margin: 0; font-family: 'Geist Mono', monospace; color: #8b8b93">[medido]</dd>
<dt style="color: #a1a1aa">Resolução</dt><dd style="margin: 0; font-family: 'Geist Mono', monospace">esperado 256 px</dd><dd style="margin: 0; font-family: 'Geist Mono', monospace; color: #8b8b93">[medido]</dd>
<dt style="color: #a1a1aa">Quadros válidos</dt><dd style="margin: 0; font-family: 'Geist Mono', monospace">sem NaN / pretos</dd><dd style="margin: 0; font-family: 'Geist Mono', monospace; color: #8b8b93">[medido]</dd>
</dl>
</section>

<section aria-labelledby="met-h" style="background: #141416; border: 1px solid #26262a; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 id="met-h" style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a1a1aa">Métricas</h2>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #a1a1aa">motion-v2</span>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; font-size: 13px">
<dt style="color: #a1a1aa">Aderência do corpo</dt><dd style="margin: 0; font-family: 'Geist Mono', monospace; color: #8b8b93">[pendente]</dd>
<dt style="color: #a1a1aa">Aderência das mãos</dt><dd style="margin: 0; font-family: 'Geist Mono', monospace; color: #8b8b93">[pendente]</dd>
<dt style="color: #a1a1aa">Estabilidade temporal</dt><dd style="margin: 0; font-family: 'Geist Mono', monospace; color: #8b8b93">[pendente]</dd>
<dt style="color: #a1a1aa">Identidade</dt><dd style="margin: 0; font-family: 'Geist Mono', monospace; color: #ffc2de">não implementada</dd>
</dl>
</section>

<section aria-labelledby="rev-h" style="flex-grow: 1; background: #141416; border: 1px solid #26262a; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 id="rev-h" style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a1a1aa">Revisão visual</h2>
<div role="group" aria-label="Veredito" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{verdicts}}" as="v" hint-placeholder-count="2"><button type="button" onClick="{{v.pick}}" aria-pressed="{{v.pressed}}" style="min-height: 44px; border-radius: 999px; border: 1px solid {{v.border}}; background: {{v.bg}}; color: {{v.fg}}; font-size: 14px; font-weight: 500; cursor: pointer">{{v.label}}</button></sc-for>
</div>
<label for="notes" style="font-size: 13px; color: #a1a1aa">Notas (rosto, mãos, cabelo, roupa, tremor)</label>
<textarea id="notes" placeholder="Ex.: mão esquerda some no quadro 9" style="flex-grow: 1; min-height: 80px; resize: none; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid #26262a; background: #1c1c1f; color: #f4f4f5; font-size: 14px; line-height: 1.5"></textarea>
<a href="estudio.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid #3a3a40; color: #f4f4f5; text-decoration: none; font-size: 14px">Voltar ao Estúdio</a>
</section>
</div>
</div>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
function buildJoints(p) {
  var b = p.bob, J = {};
  J.head = { x: 100, y: 62 + b }; J.neck = { x: 100, y: 96 + b }; J.hip = { x: 100, y: 170 + b };
  J.lSh = { x: 78, y: 100 + b }; J.rSh = { x: 122, y: 100 + b };
  J.lHip = { x: 89, y: 170 + b }; J.rHip = { x: 111, y: 170 + b };
  function P(o, len, a, s) { return { x: o.x + s * len * Math.sin(a), y: o.y + len * Math.cos(a) }; }
  J.lEl = P(J.lSh, 34, p.la1, -1); J.lWr = P(J.lEl, 30, p.la2, -1);
  J.rEl = P(J.rSh, 34, p.ra1, 1); J.rWr = P(J.rEl, 30, p.ra2, 1);
  J.lKn = P(J.lHip, 46, p.ll1, -1); J.lAn = P(J.lKn, 46, p.ll2, -1);
  J.rKn = P(J.rHip, 46, p.rl1, 1); J.rAn = P(J.rKn, 46, p.rl2, 1);
  return J;
}
function danceParams(f, n) {
  var t = f / n * 2 * Math.PI, s = 0.5 + 0.5 * Math.sin(t), s2 = 0.5 - 0.5 * Math.sin(t), c = Math.cos(t);
  var up = Math.max(0, Math.sin(t)), dn = Math.max(0, -Math.sin(t));
  return { la1: 0.5 + 1.6 * s, la2: 0.9 + 1.6 * s + 0.6 * c, ra1: 0.5 + 1.6 * s2, ra2: 0.9 + 1.6 * s2 - 0.6 * c,
    ll1: 0.1 + 0.45 * up, ll2: 0.1 - 0.15 * up, rl1: 0.1 + 0.45 * dn, rl2: 0.1 - 0.15 * dn, bob: 3 * Math.sin(2 * t) };
}
var NEUTRAL = { la1: 0.3, la2: 0.2, ra1: 0.3, ra2: 0.2, ll1: 0.08, ll2: 0.04, rl1: 0.08, rl2: 0.04, bob: 0 };
var SEGS = [
  ['head', 'neck', '#ff0055'], ['neck', 'hip', '#ff5500'], ['lSh', 'rSh', '#ff5500'], ['lHip', 'rHip', '#ff7a00'],
  ['lSh', 'lEl', '#00ff55'], ['lEl', 'lWr', '#00ffaa'], ['rSh', 'rEl', '#ffaa00'], ['rEl', 'rWr', '#ffff00'],
  ['lHip', 'lKn', '#aa00ff'], ['lKn', 'lAn', '#ff00ff'], ['rHip', 'rKn', '#00aaff'], ['rKn', 'rAn', '#0055ff']
];
var BODY = [
  ['lHip', 'lKn', '#3a3f5c', 16], ['lKn', 'lAn', '#3a3f5c', 14], ['rHip', 'rKn', '#3a3f5c', 16], ['rKn', 'rAn', '#3a3f5c', 14],
  ['neck', 'hip', '#ff4fa3', 34], ['lSh', 'rSh', '#ff4fa3', 16],
  ['lSh', 'lEl', '#ff4fa3', 13], ['lEl', 'lWr', '#ff4fa3', 11], ['rSh', 'rEl', '#ff4fa3', 13], ['rEl', 'rWr', '#ff4fa3', 11]
];
function r1(v) { return Math.round(v * 10) / 10; }
function figure(J) {
  return {
    limbs: BODY.map(function (s) { return { x1: r1(J[s[0]].x), y1: r1(J[s[0]].y), x2: r1(J[s[1]].x), y2: r1(J[s[1]].y), c: s[2], w: s[3] }; }),
    hands: [{ x: r1(J.lWr.x), y: r1(J.lWr.y) }, { x: r1(J.rWr.x), y: r1(J.rWr.y) }],
    hx: r1(J.head.x), hy: r1(J.head.y - 4),
    hair: 'M' + r1(J.head.x - 18) + ' ' + r1(J.head.y - 2) + ' A18 18 0 0 1 ' + r1(J.head.x + 18) + ' ' + r1(J.head.y - 2) + ' L' + r1(J.head.x + 20) + ' ' + r1(J.head.y + 14) + ' L' + r1(J.head.x + 13) + ' ' + r1(J.head.y - 6) + ' L' + r1(J.head.x - 13) + ' ' + r1(J.head.y - 6) + ' L' + r1(J.head.x - 20) + ' ' + r1(J.head.y + 14) + ' Z'
  };
}

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { frame: 4, playing: false, verdict: null }; }
  componentWillUnmount() { clearInterval(this.playT); }
  renderVals() {
    var s = this.state, self = this;
    var J = buildJoints(danceParams(s.frame, 17));
    var vdefs = [{ v: 'ok', label: 'Aprovar', on: '#d2ff3c', fg: '#0a0a0b' }, { v: 'bad', label: 'Reprovar', on: '#ff4fa3', fg: '#0a0a0b' }];
    return {
      ref: figure(buildJoints(NEUTRAL)), out: figure(J),
      ctrl: SEGS.map(function (g) { return { x1: r1(J[g[0]].x), y1: r1(J[g[0]].y), x2: r1(J[g[1]].x), y2: r1(J[g[1]].y), c: g[2] }; }),
      frame: s.frame, frameNum: s.frame + 1,
      onScrub: function (e) { self.setState({ frame: parseInt(e.target.value, 10) || 0 }); },
      playing: s.playing, paused: !s.playing, playLabel: s.playing ? 'Pausar' : 'Reproduzir',
      togglePlay: function () {
        if (self.state.playing) { clearInterval(self.playT); self.setState({ playing: false }); return; }
        self.playT = setInterval(function () { self.setState({ frame: (self.state.frame + 1) % 17 }); }, 1000 / 12);
        self.setState({ playing: true });
      },
      verdicts: vdefs.map(function (d) {
        var on = s.verdict === d.v;
        return { label: d.label, pressed: on ? 'true' : 'false', bg: on ? d.on : 'transparent', fg: on ? d.fg : '#f4f4f5',
          border: on ? d.on : '#3a3a40', pick: function () { self.setState({ verdict: on ? null : d.v }); } };
      })
    };
  }
}
</script>
</body>
</html>
